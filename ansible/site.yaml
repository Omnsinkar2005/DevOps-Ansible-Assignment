
---
- name: Deploy ShopEase E-commerce Website
  hosts: webservers
  become: yes

  tasks:

    - name: Update Ubuntu package cache
      apt:
        update_cache: yes

    - name: Install Nginx web server
      apt:
        name: nginx
        state: present

    - name: Copy ShopEase website to Nginx web directory
      copy:
        src: files/index.html
        dest: /var/www/html/index.html
        owner: www-data
        group: www-data
        mode: '0644'

    - name: Start and enable Nginx service
      service:
        name: nginx
        state: started
        enabled: yes
